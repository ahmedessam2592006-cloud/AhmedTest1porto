<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Project Details</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
/* ===== LIGHT THEME (DEFAULT) ===== */
:root{
    --bg-1:#f8f5ff;
    --bg-2:#f0eaff;
    --bg-3:#e8ddf5;
    --bg-card:rgba(255,255,255,0.7);
    --text-primary:#2d1b4e;
    --text-secondary:#5a3d7a;
    --text-muted:#8a6fa8;
    --accent-1:#A56ABD;
    --accent-2:#6E3482;
    --accent-3:#49225B;
    --border:rgba(165,106,189,0.25);
    --shadow:rgba(165,106,189,0.15);
    --neon-glow:0 0 15px rgba(165,106,189,0.25),0 0 30px rgba(165,106,189,0.12);
    --neon-border:0 0 8px rgba(165,106,189,0.3),0 0 16px rgba(165,106,189,0.15),inset 0 0 8px rgba(165,106,189,0.05);
    --fp:'Outfit',sans-serif;
}

/* ===== DARK THEME ===== */
[data-theme="dark"]{
    --bg-1:#1a0f2e;
    --bg-2:#2d1b4e;
    --bg-3:#49225B;
    --bg-card:rgba(255,255,255,0.05);
    --text-primary:#F5EBFA;
    --text-secondary:#E7DBEF;
    --text-muted:#A56ABD;
    --accent-1:#A56ABD;
    --accent-2:#6E3482;
    --accent-3:#49225B;
    --border:rgba(165,106,189,0.3);
    --shadow:rgba(0,0,0,0.4);
    --neon-glow:0 0 15px rgba(165,106,189,0.35),0 0 30px rgba(165,106,189,0.15);
    --neon-border:0 0 8px rgba(165,106,189,0.4),0 0 16px rgba(165,106,189,0.2),inset 0 0 8px rgba(165,106,189,0.08);
}

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--fp);background:linear-gradient(135deg,var(--bg-1)0%,var(--bg-2)50%,var(--bg-3)100%);color:var(--text-primary);min-height:100vh;overflow-x:hidden;transition:background 0.5s ease,color 0.5s ease;opacity:0}

/* Neon animations - Softer */
@keyframes neonPulse{
    0%,100%{box-shadow:var(--neon-border);border-color:rgba(165,106,189,0.4)}
    50%{box-shadow:0 0 12px rgba(165,106,189,0.5),0 0 24px rgba(165,106,189,0.25),inset 0 0 12px rgba(165,106,189,0.1);border-color:rgba(165,106,189,0.6)}
}
@keyframes neonTextPulse{
    0%,100%{text-shadow:0 0 8px rgba(165,106,189,0.25),0 0 16px rgba(165,106,189,0.1)}
    50%{text-shadow:0 0 12px rgba(165,106,189,0.4),0 0 24px rgba(165,106,189,0.2)}
}
@keyframes borderRotate{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}
@keyframes borderSpin{
    0%{transform:rotate(0deg)}
    100%{transform:rotate(360deg)}
}

.back-btn{position:fixed;top:30px;left:30px;z-index:100;width:50px;height:50px;border-radius:50%;background:var(--bg-card);backdrop-filter:blur(10px);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-primary);font-size:20px;cursor:pointer;transition:all .4s ease;text-decoration:none;animation:neonPulse 3s ease-in-out infinite}
.back-btn:hover{background:var(--accent-1);transform:translateX(-5px);box-shadow:var(--neon-glow)}

.project-hero{min-height:70vh;display:flex;align-items:center;justify-content:center;position:relative;padding:100px 50px 50px;overflow:hidden}
.project-hero::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at center,rgba(165,106,189,0.15)0%,transparent 70%)}
.project-hero-content{position:relative;z-index:10;text-align:center;max-width:900px}
.project-category{font-size:14px;letter-spacing:3px;text-transform:uppercase;color:var(--accent-1);margin-bottom:20px;opacity:0}
.project-title{font-size:clamp(36px,6vw,64px);font-weight:800;line-height:1.1;margin-bottom:25px;background:linear-gradient(135deg,var(--text-primary)0%,var(--text-secondary)50%,var(--accent-1)100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;opacity:0;animation:neonTextPulse 3s ease-in-out infinite}
.project-meta{display:flex;gap:30px;justify-content:center;flex-wrap:wrap;opacity:0}
.meta-item{display:flex;align-items:center;gap:8px;color:var(--text-secondary);font-size:15px}
.meta-item i{color:var(--accent-1)}
.project-image-main{width:100%;max-width:1100px;margin:0 auto;display:block;border-radius:24px;box-shadow:0 40px 80px var(--shadow);transform:translateY(50px);opacity:0;animation:neonPulse 3s ease-in-out infinite}
.project-details{max-width:900px;margin:0 auto;padding:80px 50px}
.project-details h3{font-size:28px;margin-bottom:20px;color:var(--text-primary);opacity:0}
.project-details p{font-size:17px;line-height:1.9;color:var(--text-secondary);margin-bottom:30px;opacity:0}
.project-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:25px;margin-top:50px}
.gallery-img{width:100%;border-radius:16px;box-shadow:0 15px 40px var(--shadow);transition:all .4s ease;opacity:0;transform:translateY(30px);animation:neonPulse 3s ease-in-out infinite}
.gallery-img:hover{transform:translateY(-10px) scale(1.02);box-shadow:var(--neon-glow)}
.next-project{text-align:center;padding:80px 50px;background:linear-gradient(180deg,transparent,rgba(165,106,189,0.08))}
.next-project h3{font-size:24px;color:var(--text-secondary);margin-bottom:20px}
.next-project a{color:var(--text-primary);font-size:32px;font-weight:700;text-decoration:none;background:linear-gradient(135deg,var(--text-primary),var(--accent-1));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;transition:all .3s ease;display:inline-block}
.next-project a:hover{transform:translateX(10px)}
.loader{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg-1);display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .6s ease,visibility .6s ease}
.loader.hidden{opacity:0;visibility:hidden}
.loader-spinner{width:50px;height:50px;border:3px solid var(--border);border-top-color:var(--accent-1);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== WHATSAPP FLOAT BUTTON ===== */
.whatsapp-float{position:fixed;bottom:30px;right:30px;z-index:1000;text-decoration:none;display:flex;align-items:center;transition:all .4s ease;animation:whatsappBob 3s ease-in-out infinite}

@keyframes whatsappBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

.whatsapp-btn{position:relative;width:60px;height:60px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;box-shadow:0 4px 20px rgba(37,211,102,0.4);transition:all .4s ease}
.whatsapp-btn i{transition:all .3s ease}
.whatsapp-float:hover .whatsapp-btn{transform:scale(1.1);box-shadow:0 6px 25px rgba(37,211,102,0.6)}
.whatsapp-float:hover .whatsapp-btn i{transform:scale(1.15) rotate(-5deg)}

/* Pulse ring animation */
.whatsapp-btn::before{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid #25D366;opacity:0;animation:whatsappPulse 2s infinite}
@keyframes whatsappPulse{0%{transform:scale(1);opacity:0.6}100%{transform:scale(1.4);opacity:0}}

@media(max-width:768px){
    .whatsapp-float{bottom:20px;right:20px}
    .whatsapp-btn{width:50px;height:50px;font-size:26px}
}
/* Theme Toggle */
.theme-toggle{position:fixed;top:30px;right:30px;z-index:999;width:50px;height:50px;border-radius:50%;background:var(--bg-card);backdrop-filter:blur(20px);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .4s ease;box-shadow:var(--neon-glow);animation:neonPulse 3s ease-in-out infinite}
.theme-toggle:hover{transform:scale(1.1) rotate(15deg)}
.theme-toggle i{font-size:20px;color:var(--accent-1)}

/* Animated border for images */
.img-neon-wrapper{position:relative;display:inline-block;border-radius:24px;padding:3px;overflow:hidden}
.img-neon-wrapper::before{content:'';position:absolute;inset:0;border-radius:24px;background:conic-gradient(from 0deg,transparent 0deg,#A56ABD 60deg,transparent 120deg,#6E3482 180deg,transparent 240deg,#E7DBEF 300deg,transparent 360deg);animation:borderSpin 3s linear infinite;opacity:0.5;z-index:0}
.img-neon-wrapper img{position:relative;z-index:1;border-radius:22px;display:block}

@media(max-width:768px){.project-hero{padding:80px 25px 40px}.project-details{padding:50px 25px}.project-meta{gap:15px}.theme-toggle{top:15px;right:15px;width:40px;height:40px}}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:var(--bg-2)}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--accent-1),var(--accent-2));border-radius:4px}
</style>
</head>
<body>
<div class="loader" id="loader"><div class="loader-spinner"></div></div>
<div class="theme-toggle" id="themeToggle" onclick="toggleTheme()"><i class="fas fa-moon" id="themeIcon"></i></div>
<a href="index.html#projects" class="back-btn"><i class="fas fa-arrow-left"></i></a>
<section class="project-hero"><div class="project-hero-content"><div class="project-category" id="pCategory">Design</div><h1 class="project-title" id="pTitle">Project Title</h1><div class="project-meta"><div class="meta-item"><i class="fas fa-calendar"></i><span id="pDate">2024</span></div><div class="meta-item"><i class="fas fa-tag"></i><span id="pClient">Client Name</span></div></div></div></section>
<div class="img-neon-wrapper" style="width:100%;max-width:1100px;margin:0 auto;display:block;"><img src="" alt="Project" class="project-image-main" id="pMainImage"></div>
<div class="project-details"><h3>About the Project</h3><p id="pDescription">Project description goes here...</p><h3 style="margin-top:50px">Gallery</h3><div class="project-gallery" id="pGallery"></div></div>
<div class="next-project"><h3>Want to see more?</h3><a href="index.html#projects">View All Projects <i class="fas fa-arrow-right"></i></a></div>
<script src="firebase-config.js"></script>
<script>
let currentTheme='light';
function toggleTheme(){
    currentTheme=currentTheme==='light'?'dark':'light';
    applyTheme(currentTheme);
    localStorage.setItem('portfolio-theme',currentTheme);
}

function applyTheme(theme){
    currentTheme=theme||'light';
    document.body.setAttribute('data-theme',currentTheme);
    document.getElementById('themeIcon').className=currentTheme==='light'?'fas fa-moon':'fas fa-sun';
}

// Load saved theme first from localStorage
const savedTheme=localStorage.getItem('portfolio-theme');
if(savedTheme){applyTheme(savedTheme);}

const urlParams=new URLSearchParams(window.location.search);
const projectId=urlParams.get('id');

if(!projectId){window.location.href='index.html';}

window.addEventListener('load',()=>{
    // If no localStorage theme, fallback to DB
    if(!savedTheme){
        db.collection('settings').doc('appearance').get().then(appearanceDoc=>{
            if(appearanceDoc.exists){applyTheme(appearanceDoc.data().theme);}
        });
    }

    // Load site identity
    db.collection('settings').doc('content').get().then(contentDoc=>{
        if(contentDoc.exists){
            const cd=contentDoc.data();
            if(cd.siteTitle){document.getElementById('pageTitle').textContent=cd.siteTitle;document.title=cd.siteTitle;}
            if(cd.logoImage){
                document.querySelector('.logo').innerHTML='<img src="'+cd.logoImage+'" alt="Logo" style="height:32px;width:auto;object-fit:contain;border-radius:6px;">';
            }else if(cd.logo){
                document.querySelector('.logo').textContent=cd.logo;
            }
        }
    });

    // Load WhatsApp
    db.collection('settings').doc('social').get().then(socialDoc=>{
        if(socialDoc.exists){
            const sd=socialDoc.data();
            const wfloat=document.getElementById('whatsappFloat');
                        if(sd.whatsapp&&sd.showWhatsapp!==false){
                const cleanNum=sd.whatsapp.replace(/[^0-9+]/g,'');
                wfloat.href='https://wa.me/'+cleanNum;
                wfloat.style.display='flex';
                            }
        }
    });

    db.collection('projects').doc(projectId).get().then(doc=>{
        if(doc.exists){
            const p=doc.data();
            document.getElementById('pCategory').textContent=p.category||'Design';
            document.getElementById('pTitle').textContent=p.title;
            document.getElementById('pDate').textContent=p.year||'2024';
            document.getElementById('pClient').textContent=p.client||'Personal Project';
            document.getElementById('pMainImage').src=p.image||'https://via.placeholder.com/1200x600/6E3482/F5EBFA?text=Project';
            document.getElementById('pDescription').textContent=p.description||'No description available.';

            const gallery=document.getElementById('pGallery');
            if(p.gallery&&p.gallery.length>0){
                p.gallery.forEach(img=>{
                    const el=document.createElement('img');
                    el.src=img;el.className='gallery-img';el.alt='Gallery';
                    gallery.appendChild(el);
                });
            }else if(p.image){
                gallery.innerHTML='<img src="'+p.image+'" class="gallery-img" alt="Project">';
            }else{
                gallery.innerHTML='<img src="https://images.unsplash.com/photo-1561070791-2526d30994b5?w=600&h=400&fit=crop" class="gallery-img"><img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=600&h=400&fit=crop" class="gallery-img">';
            }

            setTimeout(()=>{
                document.getElementById('loader').classList.add('hidden');
                // Fade in body
                document.body.style.transition='opacity 0.8s ease';
                document.body.style.opacity='1';

                gsap.to('.project-category',{opacity:1,y:0,duration:0.8,delay:0.2});
                gsap.to('.project-title',{opacity:1,y:0,duration:1,delay:0.4,ease:'power3.out'});
                gsap.to('.project-meta',{opacity:1,y:0,duration:0.8,delay:0.6});
                gsap.to('.project-image-main',{opacity:1,y:0,duration:1.2,delay:0.8,ease:'power3.out'});
                gsap.to('.project-details h3',{opacity:1,y:0,duration:0.8,stagger:0.2,delay:1});
                gsap.to('.project-details p',{opacity:1,y:0,duration:0.8,delay:1.2});
                gsap.to('.gallery-img',{opacity:1,y:0,duration:0.8,stagger:0.15,delay:1.4,ease:'power3.out'});
            },800);
        }else{
            document.getElementById('loader').classList.add('hidden');
            document.body.style.opacity='1';
            document.querySelector('.project-hero-content').innerHTML='<h1 style="font-size:48px">Project Not Found</h1>';
        }
    }).catch(err=>{
        console.error(err);
        document.getElementById('loader').classList.add('hidden');
        document.body.style.opacity='1';
    });
});
</script>
<!-- WhatsApp Float Button -->
<a href="#" class="whatsapp-float" id="whatsappFloat" target="_blank" style="display:none">
    <div class="whatsapp-btn"><i class="fab fa-whatsapp"></i></div>
</a>

</body>
</html>
